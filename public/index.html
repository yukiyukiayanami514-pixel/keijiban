<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>カンタン掲示板</title>
  <style>
    :root { --bg: #f5f5f0; --card: #fff; --text: #222; --sub: #777; --accent: #2a7ae2; --border: #ddd; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1b1b1d; --card: #26262a; --text: #eee; --sub: #999; --accent: #5b9cf0; --border: #3a3a3f; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; line-height: 1.6; }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 1.6rem; margin: 0 0 16px; }
    form, .post { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
    form { display: grid; gap: 10px; margin-bottom: 24px; }
    input, textarea { width: 100%; padding: 10px; font: inherit; color: inherit; background: var(--bg);
      border: 1px solid var(--border); border-radius: 6px; }
    textarea { min-height: 90px; resize: vertical; }
    button { justify-self: end; padding: 8px 24px; font: inherit; font-weight: bold; color: #fff;
      background: var(--accent); border: none; border-radius: 6px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .error { color: #d33; margin: 0; min-height: 1em; font-size: .9rem; }
    #posts { display: grid; gap: 12px; }
    .post header { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-size: .9rem; }
    .post .no { color: var(--sub); }
    .post .name { font-weight: bold; color: #2a9d55; }
    .post .date { color: var(--sub); }
    .post p { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .empty { color: var(--sub); text-align: center; }
  </style>
</head>
<body>
<main>
  <h1>カンタン掲示板</h1>

  <form id="form">
    <input id="name" placeholder="名前（空欄なら「名無しさん」）" maxlength="30">
    <textarea id="message" placeholder="本文を入力してください" maxlength="1000" required></textarea>
    <p class="error" id="error"></p>
    <button type="submit" id="submit">書き込む</button>
  </form>

  <section id="posts"></section>
</main>

<script>
  const postsEl = document.getElementById('posts');
  const form = document.getElementById('form');
  const nameEl = document.getElementById('name');
  const messageEl = document.getElementById('message');
  const errorEl = document.getElementById('error');
  const submitBtn = document.getElementById('submit');

  try { nameEl.value = localStorage.getItem('keijiban-name') || ''; } catch {}

  let lastJson = '';

  function render(posts) {
    if (posts.length === 0) {
      postsEl.innerHTML = '<p class="empty">まだ書き込みはありません。最初の書き込みをどうぞ！</p>';
      return;
    }
    postsEl.replaceChildren(...[...posts].reverse().map((p) => {
      const article = document.createElement('article');
      article.className = 'post';
      const header = document.createElement('header');
      const no = document.createElement('span'); no.className = 'no'; no.textContent = p.id + '.';
      const name = document.createElement('span'); name.className = 'name'; name.textContent = p.name;
      const date = document.createElement('span'); date.className = 'date';
      date.textContent = new Date(p.createdAt).toLocaleString('ja-JP');
      header.append(no, name, date);
      const body = document.createElement('p'); body.textContent = p.message;
      article.append(header, body);
      return article;
    }));
  }

  async function load() {
    try {
      const res = await fetch('/api/posts');
      const text = await res.text();
      if (text !== lastJson) { lastJson = text; render(JSON.parse(text)); }
    } catch {}
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.textContent = '';
    submitBtn.disabled = true;
    try {
      const res = await fetch('/api/posts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: nameEl.value, message: messageEl.value }),
      });
      const data = await res.json();
      if (!res.ok) { errorEl.textContent = data.error || '書き込みに失敗しました'; return; }
      try { localStorage.setItem('keijiban-name', nameEl.value); } catch {}
      messageEl.value = '';
      await load();
    } catch {
      errorEl.textContent = '通信エラーが発生しました';
    } finally {
      submitBtn.disabled = false;
    }
  });

  load();
  setInterval(load, 3000); // 3秒ごとに新しい書き込みを確認
</script>
</body>
</html>
